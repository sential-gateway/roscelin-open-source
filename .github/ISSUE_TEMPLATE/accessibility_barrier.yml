name: Accessibility barrier
description: Something in Roscelin got in your way. No diagnosis needed.
title: "Accessibility: "
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. You don't need to share any diagnosis or disability, and please leave out anything private.
        Security problems don't belong here: see SECURITY.md.
  - type: textarea
    id: trying
    attributes:
      label: What were you trying to do?
      placeholder: For example, change a task's status with the keyboard.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
      placeholder: For example, focus jumped to the top of the panel after I pressed Enter.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: For example, Chrome 158 on Windows 11
    validations:
      required: false
  - type: input
    id: assistive
    attributes:
      label: Assistive technology or settings, if any
      placeholder: For example, NVDA 2026.3, 200% zoom, Windows high contrast, voice control
    validations:
      required: false
  - type: textarea
    id: workaround
    attributes:
      label: Did you find a way around it?
    validations:
      required: false
